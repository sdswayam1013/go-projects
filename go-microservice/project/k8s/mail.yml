# ----------------------------
# Mongo Deployment
# ----------------------------

apiVersion: apps/v1          # Deployment API version
kind: Deployment             # Resource type

metadata:
  name: mailer-service              # Deployment name

spec:
  replicas: 1                # Run one Mongo Pod

  selector:
    matchLabels:
      app: mailer-service           # Select Pods having label app=mailer-service

  template:                  # Blueprint for creating Pods
    metadata:
      labels:
        app: mailer-service           # Label assigned to created Pods

    spec:
      containers:
        - name: mailer-service
          image: "sdswayam1013/mailer-service:1.0.0"
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"

          env:
            - name: MAIL_DOMAIN
              value: ""

            - name: MAIL_PORT
              value: "1025"

            - name: MAIL_ENCRYPTION
              value: "none"
            - name: MAIL_USERNAME
              value: ""
            - name: MAIL_PASSWORD
              value: ""
            - name: FROM_NAME
              value: "John Smith"
            - name: FROM_ADDRESS
              value: "john.smith@example.com"

          ports:
            - containerPort: 80  # Mongo listens here

---

# ----------------------------
# Mongo Service
# ----------------------------

apiVersion: v1               # Core API
kind: Service                # Kubernetes Service

metadata:
  name: mailer-service

spec:

  selector:
    app: mailer-service               # Forward traffic to Pods having app=mailer-service

  ports:
    - protocol: TCP
      name: main-port
      port: 80            # Service Port
      targetPort: 80      # Pod Port