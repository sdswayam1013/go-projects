# ----------------------------
# Mongo Deployment
# ----------------------------

apiVersion: apps/v1          # Deployment API version
kind: Deployment             # Resource type

metadata:
  name: listener-service              # Deployment name

spec:
  replicas: 1                # Run one Mongo Pod

  selector:
    matchLabels:
      app: listener-service           # Select Pods having label app=logger-service

  template:                  # Blueprint for creating Pods
    metadata:
      labels:
        app: listener-service           # Label assigned to created Pods

    spec:
      containers:
        - name: listener-service
          image: "sdswayam1013/listener-service:1.0.0"
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"

         

          ports:
            - containerPort: 80  # Logger service listens here
            
             

---

# ----------------------------
# Mongo Service
# ----------------------------

apiVersion: v1               # Core API
kind: Service                # Kubernetes Service

metadata:
  name: listener-service

spec:

  selector:
    app: listener-service               # Forward traffic to Pods having app=listener-service

  ports:
    - protocol: TCP
      name: web-port
      port: 80         # Service Port
      targetPort: 80 
    